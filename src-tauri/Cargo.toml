[package]
name = "orcal-tauri"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "orCAL"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
orcal-core = { path = "../crates/orcal-core" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1", features = ["api-all"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
